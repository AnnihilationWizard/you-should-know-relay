<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">you-should-know-relay before and after</title>
  <desc id="desc">Left: a Claude Code session where a you-should-know heads-up shows above the prompt and the person pastes it into the prompt by hand. Right: the same heads-up with you-should-know-relay, where a toast on the right confirms it was forwarded and Claude's next step addresses it.</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; }
    .small { font-size: 13px; }
    .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; }
    .fg { fill: #e6edf3; }
    .dim { fill: #8b949e; }
    .tool { fill: #e6edf3; font-weight: 700; }
    .dot { fill: #3fb950; }
    .claude { fill: #d97757; }
    .tag { fill: #e3b341; font-weight: 700; }
  </style>
  <rect width="960" height="440" rx="14" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="959" height="439" rx="14" fill="none" stroke="#30363d"/>
  <circle cx="24" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="22" r="6" fill="#febc2e"/>
  <circle cx="64" cy="22" r="6" fill="#28c840"/>
  <line x1="480" y1="44" x2="480" y2="416" stroke="#30363d"/>

  <!-- Before -->
  <text x="32" y="70" class="label" fill="#f85149">BEFORE</text>
  <g class="mono">
    <text x="32" y="106"><tspan class="dot">⏺</tspan><tspan class="tool" dx="8">Bash</tspan><tspan class="fg">(npm run db:migrate)</tspan></text>
    <text x="48" y="130" class="dim">⎿  Applied 3 migrations</text>
    <text x="32" y="166"><tspan class="claude">⏺</tspan><tspan class="fg" dx="8">Migrations are applied.</tspan></text>

    <rect x="32" y="232" width="424" height="58" rx="6" fill="#1c1a10" stroke="#5c4a12"/>
    <text x="46" y="256" class="small"><tspan class="tag">Heads up</tspan><tspan class="fg" dx="10">The migration used DATABASE_URL</tspan></text>
    <text x="46" y="276" class="small fg">from .env, which points to production.</text>

    <rect x="32" y="306" width="424" height="58" rx="6" fill="none" stroke="#30363d"/>
    <text x="46" y="330" class="small"><tspan class="fg">&gt;</tspan><tspan class="fg" dx="8">The migration used DATABASE_URL</tspan></text>
    <text x="62" y="350" class="small fg">from .env, which points to production.▌</text>
    <text x="32" y="392" class="label dim" style="font-weight:500;letter-spacing:0">Claude never sees it unless you paste it in</text>
  </g>

  <!-- After -->
  <text x="512" y="70" class="label" fill="#3fb950">WITH YOU-SHOULD-KNOW-RELAY</text>
  <rect x="620" y="86" width="316" height="34" rx="6" fill="#161b22" stroke="#3fb950"/>
  <text x="634" y="108" class="mono small fg">you-should-know：已把這則提醒轉給 Claude</text>
  <g class="mono">
    <text x="512" y="142"><tspan class="dot">⏺</tspan><tspan class="tool" dx="8">Bash</tspan><tspan class="fg">(npm run db:migrate)</tspan></text>
    <text x="528" y="166" class="dim">⎿  Applied 3 migrations</text>
    <text x="512" y="196"><tspan class="claude">⏺</tspan><tspan class="fg" dx="8">Heads-up checked: .env points to the</tspan></text>
    <text x="530" y="216" class="fg">production database. Stopping here to</text>
    <text x="530" y="236" class="fg">confirm before more migrations run.</text>

    <rect x="512" y="258" width="424" height="58" rx="6" fill="#1c1a10" stroke="#5c4a12"/>
    <text x="526" y="282" class="small"><tspan class="tag">Heads up</tspan><tspan class="fg" dx="10">The migration used DATABASE_URL</tspan></text>
    <text x="526" y="302" class="small fg">from .env, which points to production.</text>

    <rect x="512" y="332" width="424" height="34" rx="6" fill="none" stroke="#30363d"/>
    <text x="526" y="354" class="small"><tspan class="fg">&gt;</tspan><tspan class="dim" dx="8">▌</tspan></text>
    <text x="512" y="392" class="label dim" style="font-weight:500;letter-spacing:0">The heads-up stays on screen and reaches Claude too</text>
  </g>
</svg>
